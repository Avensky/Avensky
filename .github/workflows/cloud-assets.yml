name: Cloud asset streaming
on:
  pull_request:
    paths:
      - "frontend/**"
      - "deploy/staging-assets/**"
      - "scripts/build-*-colliders.mjs"
      - "scripts/sync-*-catalog.mjs"
      - "scripts/sync-world-builder-map.mjs"
      - "avenlab-server/src/assets/**"
      - ".github/workflows/cloud-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-pointer-build:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      VITE_PLAYER_ONBOARDING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix frontend ci
      - run: node --test frontend/tests/cloud-assets.test.mjs frontend/tests/deployment-environment.test.mjs
      - run: node --test deploy/staging-access/portal.test.mjs
      # Vite test servers restart on wardrobe catalog updates. Run suite files sequentially
      # to avoid overlapping dependency scanners and intermittent CI-only failures.
      - run: node --test --test-concurrency=1 tests/player-onboarding.test.mjs tests/character-workshop.test.mjs tests/wardrobe-preview.test.mjs
        working-directory: frontend
      - run: npm --prefix frontend run build -- --mode staging
        env:
          VITE_DEPLOY_ENV: staging
          VITE_RUST_WS_URL: wss://api-staging.avensky.com/ws/
      - name: Verify the build used pointers and excludes cloud payloads
        run: |
          git lfs pointer --check --file=frontend/public/models/roads/Road_Narrow_Oneway/Road_Narrow_Oneway_LOD0.glb
          git lfs pointer --check --file=frontend/public/models/world/garage_special.glb
          test -s frontend/.asset-release/staging.json
          test ! -e frontend/dist-staging/.asset-release
          test -s frontend/dist-staging/world-builder/catalog.json
          test -s frontend/dist-staging/images/traction-control.svg
          test -s frontend/dist-staging/images/logo.svg
          test -s frontend/dist-staging/images/logo.png
          test -s frontend/dist-staging/images/purple-sunflare.webp
          test -s frontend/dist-staging/favicon.ico
          test -z "$(find frontend/dist-staging -type f -iname '*.glb' -print -quit)"
          test -s frontend/dist-staging/images/purple-sunflare-loop.mp4
          test -z "$(find frontend/dist-staging -type f \( -iname '*.mp4' -o -iname '*.webm' \) ! -path 'frontend/dist-staging/images/purple-sunflare-loop.mp4' -print -quit)"
