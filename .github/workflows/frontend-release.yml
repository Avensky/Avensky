name: Frontend releases
on:
  pull_request:
    paths:
      - "deploy/frontend/**"
      - ".github/workflows/frontend-release.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full SHA of the staged commit with a reviewed production bundle
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Check the manual live release is enabled on main
        if: github.event_name == 'workflow_dispatch'
        env:
          LIVE_ENABLED: ${{ vars.LIVE_FRONTEND_DEPLOY_ENABLED }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main || $LIVE_ENABLED != true ]]; then
            echo "::error::Enable live releases and run this workflow from main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - run: bash -n deploy/frontend/ssh-publish.sh
      - run: python3 deploy/frontend/test_publish.py

  build-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix frontend ci
      - run: node --test frontend/tests/cloud-assets.test.mjs frontend/tests/deployment-environment.test.mjs
      - run: npm --prefix frontend run build -- --mode staging
        env:
          VITE_DEPLOY_ENV: staging
          VITE_RUST_WS_URL: wss://api-staging.avensky.com/ws/
          VITE_PLAYER_ONBOARDING: ${{ vars.STAGING_PLAYER_ONBOARDING }}
          VITE_OPEN_WORLD_ID: ${{ vars.STAGING_OPEN_WORLD_ID }}
      - name: Package the staging frontend
        run: |
          test -s frontend/dist-staging/index.html
          test -z "$(find frontend/dist-staging -type f -iname '*.glb' -print -quit)"
          test ! -e frontend/dist-staging/.asset-release
          mkdir snapshot
          mv frontend/dist-staging snapshot/web
          node --input-type=module -e '
            import { writeFileSync, readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("frontend/.asset-release/staging.json", "utf8"));
            writeFileSync("snapshot/bundle.json", JSON.stringify({
              environment: "staging", commit: process.env.GITHUB_SHA, assetRelease: release.id
            }));'
          tar --create --gzip --file staging.tar.gz -C snapshot bundle.json web
      - uses: actions/upload-artifact@v4
        with:
          name: staging-frontend
          path: staging.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-staging:
    if: github.event_name == 'push' && vars.STAGING_FRONTEND_DEPLOY_ENABLED == 'true'
    needs: [build-staging, verify-publisher]
    runs-on: ubuntu-latest
    concurrency:
      group: avensky-staging-frontend
    environment:
      name: staging
      url: https://staging.avensky.com
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-frontend
      - name: Check branch head and publish staging
        env:
          RELEASE_HOST: ${{ vars.RELEASE_HOST }}
          RELEASE_USER: ${{ vars.RELEASE_USER }}
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ vars.RELEASE_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [[ $tip != "$GITHUB_SHA" ]]; then
            echo "A newer main commit owns staging."
            exit 0
          fi
          bash deploy/frontend/ssh-publish.sh "$GITHUB_SHA" staging.tar.gz

  publish-live:
    name: Push to live
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.LIVE_FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: verify-publisher
    concurrency:
      group: avensky-live-frontend
    environment:
      name: production
      url: https://play.avensky.com
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the main commit and push to live
        env:
          CANDIDATE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_HOST: ${{ vars.RELEASE_HOST }}
          RELEASE_USER: ${{ vars.RELEASE_USER }}
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ vars.RELEASE_KNOWN_HOSTS }}
        run: |
          [[ $CANDIDATE_COMMIT =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" HEAD
          bash deploy/frontend/ssh-publish.sh "$CANDIDATE_COMMIT"
