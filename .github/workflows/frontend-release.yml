name: Deploy to live
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Staged commit SHA with an approved production bundle (defaults to current main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-publisher:
    uses: ./.github/workflows/check-receiver.yml

  publish-live:
    runs-on: ubuntu-latest
    needs: verify-publisher
    concurrency:
      group: avensky-live-frontend
    environment:
      name: production
      url: https://play.avensky.com
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the selected release and publish to production
        env:
          CANDIDATE_COMMIT: ${{ inputs.release_commit || github.sha }}
          RELEASE_HOST: ${{ vars.RELEASE_HOST }}
          RELEASE_USER: ${{ vars.RELEASE_USER }}
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ vars.RELEASE_KNOWN_HOSTS }}
        run: |
          if ! [[ $CANDIDATE_COMMIT =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$CANDIDATE_COMMIT" HEAD; then
            echo "::error::Select a full commit SHA from main."
            exit 1
          fi
          bash deploy/frontend/ssh-publish.sh "$CANDIDATE_COMMIT"
