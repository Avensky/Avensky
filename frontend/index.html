<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Avensky</title>
    <meta name="description" content="Avensky is a browser-based game engine for vehicle simulation, world building, and real-time multiplayer." />
    <link rel="preload" href="/images/logo.svg" as="image" />
    <style>
      html, body { margin: 0; background: #020617; }
      #startup-screen { position: fixed; inset: 0; z-index: 100000; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 16px; background: #020617; color: #cffafe; font: 600 13px/1.3 system-ui, sans-serif; text-align: center; }
      #startup-screen img { width: 96px; height: 96px; object-fit: contain; }
      #startup-screen p { margin: 0; }
      #startup-screen:has(> avensky-garage-room) { background: #312e29; padding: 0; }
      #startup-screen:has(> avensky-garage-room) > :is(img,p) { display: none; }
      #startup-screen avensky-garage-room, #startup-screen avensky-garage-room img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      }
      @view-transition { navigation: auto; }
    </style>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Mobile/fullscreen viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / mobile app behavior -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS fullscreen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AVENSKY" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prevent iOS gesture zoom -->
    <script>
      document.addEventListener(
        "gesturestart",
        function (event) {
          event.preventDefault();
        },
        { passive: false }
      );

      document.addEventListener(
        "gesturechange",
        function (event) {
          event.preventDefault();
        },
        { passive: false }
      );

      document.addEventListener(
        "gestureend",
        function (event) {
          event.preventDefault();
        },
        { passive: false }
      );
    </script>
  </head>

  <body>
    <!-- Visible immediately, including while the JS bundle is downloading. -->
    <div id="startup-screen" role="status" aria-label="Starting Avensky">
      <!-- staging garage -->
      <img src="/images/logo.svg" alt="Avensky" width="96" height="96" />
      <p>AVENSKY</p>
      <noscript><p>Enable JavaScript to open the game.</p></noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
